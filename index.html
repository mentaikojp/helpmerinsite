<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>俺の動画サイト</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🎬 俺の動画サイト</h1>
    <p>好きな動画を好きなだけ見る場所</p>
</header>


<main>

    <!-- =========================
         動画を追加する場所
         ========================= -->

    <section class="video-section">

        <h2>🔥 お気に入り</h2>

        <div class="video-grid">

            <!-- 動画① -->
            <div class="video-card">

                <iframe
                    src="https://www.youtube.com/embed/X8z23t428kU"
                    title="お気に入り動画"
                    allowfullscreen>
                </iframe>

                <h3>お気に入り動画</h3>

                <p>
                    これは説明文です。
                </p>

            </div>


            <!-- 動画② -->
            <div class="video-card">

                <iframe
                    src="https://www.youtube.com/embed/X8z23t428kU"
                    title="別の動画"
                    allowfullscreen>
                </iframe>

                <h3>別のお気に入り</h3>

                <p>
                    好きな動画。
                </p>

            </div>


        </div>

    </section>



    <section class="video-section">

        <h2>🤣 ネタ</h2>

        <div class="video-grid">

            <div class="video-card">

                <iframe
                    src="https://www.youtube.com/embed/X8z23t428kU"
                    title="ネタ動画"
                    allowfullscreen>
                </iframe>

                <h3>面白かったやつ</h3>

            </div>

        </div>

    </section>



    <section class="video-section">

        <h2>🎵 音楽</h2>

        <div class="video-grid">

            <div class="video-card">

                <iframe
                    src="https://www.youtube.com/embed/X8z23t428kU"
                    title="音楽"
                    allowfullscreen>
                </iframe>

                <h3>作業用BGM</h3>

            </div>

        </div>

    </section>

</main>


<footer>
    <p>俺専用動画サイト</p>
</footer>


<script src="script.js"></script>

</body>
</html>
